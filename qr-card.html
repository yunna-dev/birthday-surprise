<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17202a">
<title>A little note</title>
<style>
  * { box-sizing:border-box }
  body { margin:0; min-height:100svh; display:grid; place-items:center; padding:20px; color:#fff4d6; background:linear-gradient(145deg,#17202a,#344d43); font-family:system-ui,-apple-system,Segoe UI,sans-serif }
  main { width:min(540px,100%); padding:clamp(24px,7vw,46px); text-align:center; border:4px solid #8bd8b1; background:#17202a; box-shadow:9px 9px #0e151b }
  .pixel { font-size:3.3rem; line-height:1 }
  .tag { color:#8bd8b1; font-size:.75rem; font-weight:850; letter-spacing:.16em; text-transform:uppercase }
  h1 { margin:12px 0; font-size:clamp(2rem,8vw,3rem); line-height:1.05 }
  p { color:#dce9dc; line-height:1.65 }
  .linkbox { display:block; width:100%; padding:13px; border:2px solid #738b7c; border-radius:0; color:#fff4d6; background:#10171b; font:inherit; font-size:.9rem }
  .actions { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin-top:12px }
  button { padding:12px 16px; border:3px solid #10171b; color:#14212b; background:#ffd166; font:inherit; font-weight:850; cursor:pointer; box-shadow:4px 4px #71977e }
  .copy-status { min-height:1.5em; color:#8bd8b1; font-size:.9rem }
  .note { margin-top:24px; font-size:.82rem; color:#b8c9bd }
</style>
</head>
<body>
<main>
  <div class="pixel" aria-hidden="true">🎁</div>
  <p class="tag">A little something for you</p>
  <h1>For your birthday</h1>
  <p>To enjoy your birthday cake, open this link on your computer.</p>
  <label for="birthdayLink"><strong>Birthday link</strong></label>
  <input id="birthdayLink" class="linkbox" readonly aria-label="Link to open on your computer">
  <div class="actions">
    <button id="copyButton" type="button">Copy link</button>
  </div>
  <p class="copy-status" id="status" aria-live="polite"></p>
  <p class="note">💛</p>
</main>
<script>
  const linkField=document.getElementById('birthdayLink');
  const status=document.getElementById('status');
  const copyButton=document.getElementById('copyButton');
  // The files are hosted side by side: this resolves to the hosted bd.html URL.
  linkField.value=new URL('bd.html', location.href).href;
  function getLink(){
    return linkField.value;
  }
  async function copyLink(){
    const link=getLink();
    try { await navigator.clipboard.writeText(link); }
    catch { linkField.value=link; linkField.focus(); linkField.select(); document.execCommand('copy'); }
    status.textContent='Link copied. Open a browser on the computer and paste it in the address bar.';
  }
  copyButton.addEventListener('click',copyLink);
</script>
</body>
</html>
